<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121A1C">
<title>Física — Aplicações interativas (UFRB)</title>
<meta name="description" content="Aplicações interativas para as aulas de Física I e II.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121A1C;
    --surface: #192427;
    --line: #29383B;
    --ink: #ECEFEA;
    --ink-dim: #93A6A1;
    --green: #64C596;
    --amber: #E3A06B;
    color-scheme: dark;
  }

  *{ box-sizing: border-box; }

  html{
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  body{
    margin: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  .wrap{
    max-width: 680px;
    margin: 0 auto;
    padding: 3.2rem 1.5rem 4rem;
  }

  header p.eyebrow{
    margin: 0 0 0.6rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.85rem;
    color: var(--green);
  }

  h1{
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 5.4vw, 3rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 0.9rem;
  }

  header p.lede{
    margin: 0;
    max-width: 42ch;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--ink-dim);
  }

  /* onda: divisor estrutural, não decoração — a própria forma do assunto */
  .onda{
    display: block;
    width: 100%;
    height: 44px;
    margin: 2.6rem 0;
    overflow: visible;
  }
  .onda path{
    fill: none;
    stroke: var(--line);
    stroke-width: 1.5;
  }
  .onda path.ativa{
    stroke: var(--green);
    stroke-width: 1.5;
    stroke-dasharray: 6 5;
    animation: fluir 5s linear infinite;
  }
  @keyframes fluir{
    to{ stroke-dashoffset: -220; }
  }
  @media (prefers-reduced-motion: reduce){
    .onda path.ativa{ animation: none; }
  }

  section.app{
    padding: 0.2rem 0 2.6rem;
  }

  section.app h2{
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-style: italic;
    font-size: 1.55rem;
    margin: 0 0 0.2rem;
  }

  section.app p.rotulo{
    margin: 0 0 1.1rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.82rem;
    color: var(--ink-dim);
  }

  section.app p{
    margin: 0 0 1rem;
    max-width: 66ch;
    line-height: 1.7;
    font-size: 0.98rem;
  }

  section.app p:last-of-type{ margin-bottom: 1.4rem; }

  .mono{
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.93em;
    color: var(--amber);
  }

  .formula{
    display: inline-block;
    margin: 0.2rem 0 1.3rem;
    padding: 0.7rem 1rem;
    border: 1px dashed var(--amber);
    border-radius: 3px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.95rem;
    color: var(--amber);
    background: color-mix(in srgb, var(--amber) 7%, transparent);
  }

  .abrir{
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.3rem;
    background: var(--green);
    color: #0E1B14;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    border-radius: 6px;
  }
  .abrir:focus-visible, a:focus-visible{
    outline: 2px solid var(--green);
    outline-offset: 3px;
  }
  .abrir:hover{ background: #78D6A6; }

  footer{
    margin-top: 1rem;
    padding-top: 1.6rem;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--ink-dim);
  }

  @media (max-width: 420px){
    .wrap{ padding: 2.4rem 1.25rem 3rem; }
  }

  .disc{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.3rem 1.5rem;margin:0 0 1rem}
  .disc:hover{border-color:var(--green)}
  .disc h2{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.5rem;margin:0 0 .3rem}
  .disc p{margin:0;color:var(--ink-dim);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Física — UFRB</p>
    <h1>Aplicações interativas para as aulas</h1>
    <p class="lede">Escolha a disciplina. Tudo abre no navegador, sem instalar nada.</p>
  </header>
  <a class="disc" href="fisica-i/"><h2>Física I</h2><p>Mecânica: leis de Newton, referenciais que giram, produto vetorial em 3D.</p></a>
  <a class="disc" href="fisica-ii/"><h2>Física II</h2><p>Oscilações e ondas: MHS, modos vibracionais, batimento.</p></a>
</div>
</body>
</html>
